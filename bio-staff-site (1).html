<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     COME PERSONALIZZARE
     Scorri fino al tag <script> in fondo al file: li' trovi
     l'oggetto CONFIG dove modifichi nome, bio, social e tutte
     le entry di Minecraft/Discord. Non serve toccare altro.
     Per i colori, cambia le variabili qui sotto in :root.
     ============================================================ */

  :root{
    --bg:            #060608;
    --bg-soft:       #0c0c11;
    --line:          #1b1b24;
    --text:          #e7e7f0;
    --text-dim:      #83839a;
    --accent-violet: #8b5cf6;
    --accent-blue:   #4d8dff;
    --accent-green:  #2fe0a8;
    --font-display:  'Sora', sans-serif;
    --font-body:     'Inter', sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
  }

  body{
    background-image:
      radial-gradient(circle at 15% -5%, rgba(139,92,246,0.10), transparent 40%),
      radial-gradient(circle at 100% 10%, rgba(77,141,255,0.07), transparent 40%);
    background-attachment:fixed;
  }

  a{ color:inherit; text-decoration:none; }
  ::selection{ background:var(--accent-violet); color:#fff; }

  a:focus-visible, button:focus-visible{
    outline:2px solid var(--accent-blue);
    outline-offset:3px;
    border-radius:3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  /* ---------------- INTRO ---------------- */

  #intro{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px;
    cursor:pointer;
    z-index:50;
    transition:opacity .6s ease, transform .6s ease;
  }

  #intro.leaving{ opacity:0; transform:scale(1.03); pointer-events:none; }

  .intro-orb{
    width:10px; height:10px;
    border-radius:50%;
    background:var(--accent-violet);
    box-shadow:0 0 0 6px rgba(139,92,246,0.12), 0 0 24px rgba(139,92,246,0.55);
    animation:pulse 1.8s ease-in-out infinite;
    margin-bottom:8px;
  }

  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

  .intro-name{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(24px, 5vw, 34px);
    letter-spacing:0.2px;
  }

  .intro-hint{
    font-family:var(--font-body);
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:1.5px;
  }

  /* ---------------- LAYOUT PRINCIPALE ---------------- */

  #app{
    max-width:560px;
    margin:0 auto;
    padding:48px 20px 90px;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s ease, transform .5s ease;
  }

  #app.visible{ opacity:1; transform:translateY(0); }

  nav.tabs{
    display:flex;
    gap:24px;
    margin-bottom:40px;
    border-bottom:1px solid var(--line);
  }

  nav.tabs button{
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    color:var(--text-dim);
    background:transparent;
    border:none;
    padding:0 0 12px;
    cursor:pointer;
    position:relative;
  }

  nav.tabs button.active{ color:var(--text); }

  nav.tabs button.active::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:2px;
    background:var(--accent-violet);
    box-shadow:0 0 8px var(--accent-violet);
  }

  section.view{ display:none; }
  section.view.active{ display:block; }

  /* ---------------- BIO ---------------- */

  .bio-avatar{
    width:76px; height:76px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:18px;
    border:1px solid var(--line);
  }

  .bio-name{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:700;
    margin-bottom:6px;
  }

  .bio-tagline{
    color:var(--accent-blue);
    font-size:14px;
    font-weight:600;
    margin-bottom:20px;
  }

  .bio-meta{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:22px;
  }

  .bio-meta b{ color:var(--text); font-weight:600; }

  .bio-socials{ display:flex; gap:18px; }

  .bio-socials a{
    font-size:13px;
    font-weight:600;
    color:var(--accent-blue);
    border-bottom:1px solid transparent;
    transition:border-color .15s ease;
  }

  .bio-socials a:hover{ border-color:var(--accent-blue); }

  /* ---------------- ESPERIENZA ---------------- */

  .exp-section-title{
    font-family:var(--font-display);
    font-size:15px;
    font-weight:700;
    margin:32px 0 4px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }

  .exp-section-title:first-child{ margin-top:0; }

  .exp-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    opacity:0;
    transform:translateY(6px);
    animation:row-in .45s ease forwards;
  }

  @keyframes row-in{ to{ opacity:1; transform:translateY(0); } }

  .exp-left{ min-width:0; }

  .exp-server{
    font-family:var(--font-display);
    font-weight:700;
    font-size:14px;
    margin-bottom:4px;
  }

  .exp-badges{
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
    font-size:12.5px;
    color:var(--text-dim);
  }

  .exp-badge{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }

  .exp-badge .tier-dot{
    width:6px; height:6px;
    border-radius:50%;
    flex-shrink:0;
  }

  .tier-helper .tier-dot{ background:var(--accent-blue); box-shadow:0 0 5px var(--accent-blue); }
  .tier-mod    .tier-dot{ background:var(--accent-violet); box-shadow:0 0 5px var(--accent-violet); }
  .tier-admin  .tier-dot{ background:var(--accent-green); box-shadow:0 0 5px var(--accent-green); }
  .tier-verified .tier-dot{ background:var(--accent-green); }
  .tier-other  .tier-dot{ background:var(--text-dim); }

  .exp-proof{
    flex-shrink:0;
    font-size:12px;
    font-weight:700;
    color:var(--accent-blue);
    border-bottom:1px solid transparent;
    transition:border-color .15s ease;
  }

  .exp-proof:hover{ border-color:var(--accent-blue); }

  .exp-proof.disabled{
    color:var(--text-dim);
    cursor:default;
  }

  footer.credit{
    margin-top:50px;
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
  }

</style>
</head>
<body>

  <div id="intro">
    <div class="intro-orb"></div>
    <div class="intro-name" id="introName">Profilo</div>
    <div class="intro-hint">CLICCA PER ENTRARE</div>
  </div>

  <div id="app">
    <nav class="tabs">
      <button data-view="bio" class="active">Bio</button>
      <button data-view="exp">Staff Experience</button>
    </nav>

    <section class="view active" id="view-bio">
      <img id="bioAvatar" class="bio-avatar" src="" alt="">
      <div class="bio-name" id="bioName"></div>
      <div class="bio-tagline" id="bioTagline"></div>
      <div class="bio-meta" id="bioMeta"></div>
      <div class="bio-socials" id="bioSocials"></div>
    </section>

    <section class="view" id="view-exp">
      <div id="expSections"></div>
    </section>

    <footer class="credit" id="credit"></footer>
  </div>

<script>

  /* ============================================================
     CONFIG — modifica solo qui per personalizzare il sito.
     ============================================================ */

  const CONFIG = {

    profile: {
      name: "IlTuoNome",
      tagline: "Staff & PC Forensics",
      avatar: "https://api.dicebear.com/7.x/shapes/svg?seed=profile", // metti qui l'URL della tua immagine
      age: 18,
      place: "Italia",
      occupation: "Studente • Minecraft Staff",
      socials: [
        { label: "Discord",  url: "#" },
        { label: "Telegram", url: "#" }
      ]
    },

    // ogni sezione diventa un blocco dentro "Staff Experience"
    // (es. "Minecraft Experience", "Discord Experience", ma puoi
    // aggiungerne quante ne vuoi, o rinominarle)
    sections: [
      {
        title: "Minecraft Experience",
        entries: [
          {
            server: "NomeServer1",
            badges: [
              { tier: "helper", label: "Helper" }
            ],
            proof: "#"
          },
          {
            server: "NomeServer2",
            badges: [
              { tier: "mod", label: "Jr.Mod" },
              { tier: "verified", label: "SS Verified" }
            ],
            proof: "#"
          },
          {
            server: "NomeServer3",
            badges: [
              { tier: "admin", label: "Jr.Admin" },
              { tier: "other", label: "Head SS" }
            ],
            proof: null // metti null se non hai un link proof (mostra "PROOF" non cliccabile)
          }
        ]
      },
      {
        title: "Discord Experience",
        entries: [
          {
            server: "NomeServer Discord 1",
            badges: [
              { tier: "mod", label: "Moderator" },
              { tier: "verified", label: "SS Verified" }
            ],
            proof: "#"
          },
          {
            server: "NomeServer Discord 2",
            badges: [
              { tier: "helper", label: "Helper" }
            ],
            proof: "#"
          }
        ]
      }
    ],

    // tier disponibili per il pallino colorato: helper (blu), mod (viola), admin/verified (verde), other (grigio)

    footerText: "Sito personale — fatto con cura"
  };

  /* ============================================================
     Motore del sito: legge CONFIG e costruisce la pagina.
     Non serve modificarlo per personalizzare i contenuti.
     ============================================================ */

  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  function renderBio(){
    document.getElementById('introName').textContent = CONFIG.profile.name;
    document.getElementById('bioAvatar').src = CONFIG.profile.avatar;
    document.getElementById('bioName').textContent = CONFIG.profile.name;
    document.getElementById('bioTagline').textContent = CONFIG.profile.tagline;

    const meta = document.getElementById('bioMeta');
    meta.innerHTML = '';
    [
      ['Age', CONFIG.profile.age ? CONFIG.profile.age + ' y/o' : null],
      ['Place', CONFIG.profile.place],
      ['Occupation', CONFIG.profile.occupation]
    ].forEach(([label, value]) => {
      if(!value) return;
      meta.appendChild(el('div', null, `${label}: <b>${value}</b>`));
    });

    const socials = document.getElementById('bioSocials');
    socials.innerHTML = '';
    CONFIG.profile.socials.forEach(s => {
      const a = el('a', null, s.label);
      a.href = s.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      socials.appendChild(a);
    });

    document.getElementById('credit').textContent = CONFIG.footerText;
  }

  function renderExperience(){
    const wrap = document.getElementById('expSections');
    wrap.innerHTML = '';
    let delay = 0;

    CONFIG.sections.forEach(section => {
      wrap.appendChild(el('div', 'exp-section-title', section.title));

      section.entries.forEach(entry => {
        const row = el('div', 'exp-row');
        row.style.animationDelay = delay + 'ms';
        delay += 35;

        const left = el('div', 'exp-left');
        left.appendChild(el('div', 'exp-server', entry.server));

        const badgeWrap = el('div', 'exp-badges');
        entry.badges.forEach(b => {
          const badge = el('span', `exp-badge tier-${b.tier || 'other'}`);
          badge.innerHTML = `<span class="tier-dot"></span>${b.label}`;
          badgeWrap.appendChild(badge);
        });
        left.appendChild(badgeWrap);
        row.appendChild(left);

        const proof = entry.proof
          ? Object.assign(el('a', 'exp-proof', 'PROOF'), { href: entry.proof, target: '_blank', rel: 'noopener noreferrer' })
          : el('span', 'exp-proof disabled', 'PROOF');
        row.appendChild(proof);

        wrap.appendChild(row);
      });
    });
  }

  document.querySelectorAll('nav.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('section.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + btn.dataset.view).classList.add('active');
    });
  });

  document.getElementById('intro').addEventListener('click', function(){
    this.classList.add('leaving');
    setTimeout(() => {
      this.style.display = 'none';
      document.getElementById('app').classList.add('visible');
    }, 600);
  });

  renderBio();
  renderExperience();

</script>
</body>
</html>
